name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify .NET Version
        shell: pwsh
        run: |
          dotnet --info

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build & Package Binaries
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          }
          if (-not $ver) {
            $ver = "1.0.0"
          }
          Write-Host "Building Release packages for v$ver..."
          .\build-release.ps1 -Version $ver

      - name: Upload Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: 童伴守护 (ChildGuard) ${{ github.ref_name || format('v{0}', github.event.inputs.version) }} 正式版
          body_path: publish/release-notes.md
          files: |
            publish/ChildGuard-*-Setup.exe
            publish/ChildGuard-*-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

